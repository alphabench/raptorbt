name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clippy builds pyo3, so this job carries the same interpreter ceiling
      # as `test` -- pinned for the same reason.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      # --no-default-features drops pyo3's extension-module, whose unresolved
      # Python symbols would otherwise fail to link outside a wheel build.
      - name: Run Rust clippy
        run: cargo clippy --no-default-features --all-targets

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pyo3 0.20.3 supports Python 3.12 at the newest, and its build script
      # aborts against anything later. Runner images have moved their default
      # interpreter past that, so the version is pinned here rather than left
      # to the image -- an unpinned runner upgrade breaks the build, not a
      # change in this repo.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # extension-module leaves Python symbols to be resolved by the host
      # interpreter at import time, which a test binary cannot satisfy -- so
      # the suite links only with the feature off. Before 0.5.0 the feature was
      # unconditional and `cargo test` could not link at all, which is why CI
      # previously ran nothing but an import smoke test.
      - name: Run tests
        run: cargo test --no-default-features --all-targets

  build:
    name: wheel (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - name: Install wheel and run behavioral tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest numpy
          python -c "import raptorbt; print('version:', raptorbt.__version__)"
          pytest tests/python -v
