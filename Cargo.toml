[package]
name = "raptorbt"
version = "0.6.4"
edition = "2021"
description = "High-performance Rust backtesting engine with Python bindings. Bar-level and tick-level simulation with sub-millisecond execution and a minimal footprint."
authors = ["Alphabench <contact@alphabench.in>"]
license = "MIT"
repository = "https://github.com/alphabench/raptorbt"
homepage = "https://www.alphabench.in/raptorbt"
readme = "README.md"
keywords = ["backtesting", "trading", "quantitative-finance", "rust", "python"]
categories = ["finance", "simulation"]

[lib]
name = "raptorbt"
crate-type = ["cdylib", "rlib"]

[features]
# On by default so `maturin build` produces an extension module. Tests must run
# with --no-default-features: `extension-module` leaves Python symbols to be
# resolved by the host interpreter at import time, which a test binary has no
# way to satisfy, so linking fails.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20" }
numpy = "0.20"
rayon = "1.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Conic interior-point QP solver for the portfolio optimizer. Pure Rust (no C
# toolchain, so maturin cross-builds are unaffected), deterministic, and it
# reports Infeasible/NumericalError as hard statuses -- which is what lets the
# optimizer refuse instead of silently returning a best-effort iterate.
clarabel = "0.11"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "backtest_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
