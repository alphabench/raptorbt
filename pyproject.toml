[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "raptorbt"
version = "1.2.0"
description = "High-performance Rust backtesting engine with Python bindings. Bar-level and tick-level simulation with sub-millisecond execution and a minimal footprint."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Alphabench", email = "contact@alphabench.in"}
]
keywords = [
    "backtesting",
    "trading",
    "quantitative-finance",
    "algorithmic-trading",
    "rust",
    "high-performance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The broker mappings use only the standard library for HTTP, so the extras add
# no packages today. They exist so a project can depend on `raptorbt[kite]` and
# keep working if a mapping later needs a client library.
kite = []
upstox = []
dhan = []

[dependency-groups]
# What the test suite needs beyond the package itself; CI installs the same list.
test = ["pytest", "numpy", "scipy"]
# Only for regenerating tests/python/oracle/fixtures (tests/oracle/generate.py); the tests
# replay committed fixtures and need none of these. Pins are the versions the fixtures were generated with; TA-Lib 0.6.4
# is the C library's release the fixtures name in their headers.
oracle = [
    "numpy",
    "TA-Lib==0.6.4",
    "statsmodels==0.15.0",
    "arch==8.0.0",
    "scipy==1.18.1",
]

[project.urls]
Homepage = "https://www.alphabench.in/raptorbt"
Repository = "https://github.com/alphabench/raptorbt"
Documentation = "https://www.alphabench.in/raptorbt"
"Bug Tracker" = "https://github.com/alphabench/raptorbt/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "raptorbt._raptorbt"
# The skill files live in skills/ and are reached from the package through the
# symlink python/raptorbt/skills/_data. maturin does not follow that link by
# itself, so the wheel lists the files through it (they land at
# raptorbt/skills/_data) and the sdist carries the real directory.
include = [
    { path = "python/raptorbt/skills/_data/**/*", format = "wheel" },
    { path = "skills/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
# Every warning is an error: a test that triggers one either fixes its cause or
# asserts it with pytest.warns. Add a third-party exemption here only by message,
# with the reason.
filterwarnings = ["error"]
